<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="לוח החתולים">
<meta name="theme-color" content="#EDF2EE">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#EDF2EE;
    --paper:#FBFAF6;
    --ink:#26332E;
    --ink-soft:#5C6B65;
    --line:#DDE5DE;
    --unknown-bg:#F1F0EA;
    --unknown-ink:#8B9088;
    --no-bg:#F6E9E7;
    --no-ink:#B5564A;
    --tommy:#C9762E;   --tommy-bg:#F7EADC;
    --chocha:#8A6A45;  --chocha-bg:#F0E7DA;
    --pushky:#5C7A82;  --pushky-bg:#E7EFF0;
    --home:#3E8E82;    --home-bg:#E4F1EE;
    --radius:22px;
    --shadow: 0 2px 14px rgba(38,51,46,0.07), 0 1px 2px rgba(38,51,46,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family:'Assistant', sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .app{ max-width: 880px; margin: 0 auto; }

  header.top{ text-align:center; margin-bottom: 26px; }
  header.top h1{
    font-family:'Suez One', serif;
    font-weight:400;
    font-size: 40px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  header.top p{
    color: var(--ink-soft);
    font-size:15px;
    margin:0;
  }

  .cats-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 720px){
    .cats-grid{ grid-template-columns: 1fr; }
  }

  .cat-card{
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 18px 18px;
    border: 1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .cat-card::before{
    content:"";
    position:absolute; inset:0 0 auto 0;
    height:6px;
    background: var(--accent);
  }
  .cat-head{
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .cat-photo{
    width:68px;height:68px;border-radius:16px;
    object-fit:cover;
    flex-shrink:0;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--accent);
  }
  .cat-name{
    font-family:'Suez One', serif;
    font-size:22px;
  }
  .cat-sub{
    font-size:12.5px; color:var(--ink-soft); margin-top:1px;
  }

  .meal-list{ display:flex; flex-direction:column; gap:12px; }
  .meal-row-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .meal-label{ font-weight:700; font-size:15.5px; }
  .status-badge{
    font-size:12px; font-weight:800; border-radius:8px; padding:2px 9px;
    background: var(--unknown-bg); color: var(--unknown-ink);
  }
  .status-badge.yes{ background: var(--accent-bg); color: var(--accent); }
  .status-badge.no{ background: var(--no-bg); color: var(--no-ink); }

  .choice-row{ display:flex; gap:8px; }
  .choice-btn{
    flex:1;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:9px 6px;
    cursor:pointer;
    font-family:'Assistant'; font-size:14px; font-weight:700;
    color: var(--ink-soft);
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .06s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .choice-btn:active{ transform: scale(0.97); }
  .choice-btn.yes.active{
    background: var(--accent-bg); border-color: var(--accent); color: var(--accent);
  }
  .choice-btn.no.active{
    background: var(--no-bg); border-color: var(--no-ink); color: var(--no-ink);
  }

  .home-section{
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border:1px solid var(--line);
    padding: 22px 20px 20px;
    position:relative; overflow:hidden;
  }
  .home-section::before{
    content:""; position:absolute; inset:0 0 auto 0; height:6px; background:var(--home);
  }
  .home-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .home-badge{
    width:40px;height:40px;border-radius:50%;
    background: var(--home-bg);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .home-badge svg{ width:22px; height:22px; fill: var(--home); }
  .home-title{ font-family:'Suez One', serif; font-size:22px; }
  .home-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }

  .who-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .who-card{
    border:1.5px solid var(--line);
    border-radius:16px;
    padding: 12px 12px 10px;
    background:#fff;
  }
  .who-top{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:6px;
  }
  .who-name-wrap{ display:flex; align-items:center; gap:8px; }
  .who-photo{
    width:44px;height:44px;border-radius:12px;
    object-fit:cover;
    flex-shrink:0;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--accent);
  }
  .who-name{ font-weight:700; font-size:15px; }
  .who-sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .note-sub{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

  .note-block{
    border-top:1px dashed var(--line); padding-top:16px;
  }
  .note-label{
    font-weight:700; font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .note-label span.hint{ font-weight:500; color:var(--ink-soft); font-size:12px; }
  textarea#noteInput{
    width:100%; min-height:64px; resize:vertical;
    border:1.5px solid var(--line); border-radius:14px;
    padding:12px 14px; font-family:'Assistant'; font-size:14.5px;
    color:var(--ink); background:#fff;
  }
  textarea#noteInput:focus{ outline:2px solid var(--home); outline-offset:1px; }

  footer.tip{
    text-align:center; color: var(--ink-soft); font-size:12px; margin-top:26px; line-height:1.7;
  }
  footer.tip b{ color: var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

async function kvGet(key){
  const { data, error } = await sb.from('board_kv').select('value').eq('key', key).maybeSingle();
  if (error) { console.error('kvGet error', error); return null; }
  return data ? data.value : null;
}
async function kvSet(key, value){
  const { error } = await sb.from('board_kv').upsert({ key, value, updated_at: new Date().toISOString() });
  if (error) console.error('kvSet error', error);
}

const catsGrid = document.getElementById('catsGrid');
const whoGrid = document.getElementById('whoGrid');
const noteInput = document.getElementById('noteInput');
const noteUpdatedText = document.getElementById('noteUpdatedText');

function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
const HOME_ROLLING_MS = 6 * 60 * 60 * 1000; // who's-home + note reset 6h after their own last update

function defaultMealsData(){
  const cats = {};
  const lastUpdated = {};
  const now = new Date().toISOString();
  CATS.forEach(c=>{
    cats[c.id] = {};
    c.meals.forEach(m => cats[c.id][m] = null);
    lastUpdated[c.id] = now;
  });
  return { date: todayStr(), cats, lastUpdated };
}

function defaultHomeData(){
  const cats = {};
  const lastUpdated = {};
  CATS.forEach(c=>{ cats[c.id] = null; lastUpdated[c.id] = null; });
  return { cats, lastUpdated, note: '', noteUpdated: null };
}

let mealsData = null;
let homeData = null;
let noteSaveTimer = null;

async function loadMealsData(){
  try{
    const value = await kvGet('cat-meals');
    if(value){
      let parsed = value;
      if(parsed.date !== todayStr()){
        parsed = defaultMealsData();
        await kvSet('cat-meals', parsed);
      }
      if(!parsed.lastUpdated) parsed.lastUpdated = {};
      CATS.forEach(c=>{ if(!(c.id in parsed.lastUpdated)) parsed.lastUpdated[c.id] = null; });
      mealsData = parsed;
    } else {
      mealsData = defaultMealsData();
      await kvSet('cat-meals', mealsData);
    }
  } catch(e){
    mealsData = defaultMealsData();
    try{ await kvSet('cat-meals', mealsData); }catch(e2){}
  }
}
async function saveMealsData(){
  try{ await kvSet('cat-meals', mealsData); }
  catch(e){ console.error('save meals failed', e); }
}

function applyHomeRollovers(){
  // returns true if anything changed
  let changed = false;
  const now = Date.now();
  CATS.forEach(c=>{
    const lu = homeData.lastUpdated[c.id];
    if(lu && (now - new Date(lu).getTime() >= HOME_ROLLING_MS)){
      homeData.cats[c.id] = null;
      homeData.lastUpdated[c.id] = new Date().toISOString();
      changed = true;
    }
  });
  if(homeData.noteUpdated && (now - new Date(homeData.noteUpdated).getTime() >= HOME_ROLLING_MS)){
    homeData.note = '';
    homeData.noteUpdated = new Date().toISOString();
    changed = true;
  }
  return changed;
}

async function loadHomeData(){
  try{
    const value = await kvGet('home-status');
    if(value){
      let parsed = value;
      if(!parsed.cats) parsed.cats = {};
      CATS.forEach(c=>{ if(!(c.id in parsed.cats)) parsed.cats[c.id] = null; });
      if(!parsed.lastUpdated) parsed.lastUpdated = {};
      CATS.forEach(c=>{ if(!(c.id in parsed.lastUpdated)) parsed.lastUpdated[c.id] = null; });
      if(typeof parsed.note !== 'string') parsed.note = '';
      if(typeof parsed.noteUpdated === 'undefined') parsed.noteUpdated = null;
      delete parsed.block;
      homeData = parsed;
      if(applyHomeRollovers()) await kvSet('home-status', homeData);
    } else {
      homeData = defaultHomeData();
      await kvSet('home-status', homeData);
    }
  } catch(e){
    homeData = defaultHomeData();
    try{ await kvSet('home-status', homeData); }catch(e2){}
  }
}
async function saveHomeData(){
  try{ await kvSet('home-status', homeData); }
  catch(e){ console.error('save home failed', e); }
}

function badgeLabel(status){
  if(status === null) return { text:'? לא ידוע', cls:'' };
  return null;
}

function formatUpdatedTime(iso){
  if(!iso) return 'טרם עודכן';
  const d = new Date(iso);
  return `התעדכן לאחרונה בשעה ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderCats(){
  catsGrid.innerHTML = '';
  CATS.forEach(cat=>{
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.setProperty('--accent', `var(${cat.accent})`);
    card.style.setProperty('--accent-bg', `var(${cat.accentBg})`);

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <img class="cat-photo" src="${cat.photo}" alt="${cat.name}">
      <div>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-sub">${formatUpdatedTime(mealsData.lastUpdated[cat.id])}</div>
      </div>`;
    card.appendChild(head);

    const list = document.createElement('div');
    list.className = 'meal-list';

    cat.meals.forEach(meal=>{
      const status = mealsData.cats[cat.id][meal];
      const row = document.createElement('div');

      const top = document.createElement('div');
      top.className = 'meal-row-top';
      const lbl = badgeLabel(status);
      top.innerHTML = `<span class="meal-label">${meal}</span>` + (lbl ? `<span class="status-badge ${lbl.cls}">${lbl.text}</span>` : '');
      row.appendChild(top);

      const choices = document.createElement('div');
      choices.className = 'choice-row';

      const yesBtn = document.createElement('button');
      yesBtn.className = 'choice-btn yes' + (status === true ? ' active' : '');
      yesBtn.textContent = 'כן';
      const noBtn = document.createElement('button');
      noBtn.className = 'choice-btn no' + (status === false ? ' active' : '');
      noBtn.textContent = 'לא';

      yesBtn.addEventListener('click', async ()=>{
        const cur = mealsData.cats[cat.id][meal];
        mealsData.cats[cat.id][meal] = (cur === true) ? null : true;
        mealsData.lastUpdated[cat.id] = new Date().toISOString();
        await saveMealsData();
        renderCats();
      });
      noBtn.addEventListener('click', async ()=>{
        const cur = mealsData.cats[cat.id][meal];
        mealsData.cats[cat.id][meal] = (cur === false) ? null : false;
        mealsData.lastUpdated[cat.id] = new Date().toISOString();
        await saveMealsData();
        renderCats();
      });

      choices.appendChild(yesBtn);
      choices.appendChild(noBtn);
      row.appendChild(choices);
      list.appendChild(row);
    });

    card.appendChild(list);
    catsGrid.appendChild(card);
  });
}

function whereBadge(status){
  if(status === null) return { text:'? לא ידוע', cls:'' };
  return null;
}

    homeBtn.className = 'choice-btn yes' + (status === true ? ' active' : '');
    homeBtn.textContent = 'בבית';
    const awayBtn = document.createElement('button');
    awayBtn.className = 'choice-btn no' + (status === false ? ' active' : '');
    awayBtn.textContent = 'בחוץ';

    homeBtn.addEventListener('click', async ()=>{
      const cur = homeData.cats[cat.id];
      homeData.cats[cat.id] = (cur === true) ? null : true;
      homeData.lastUpdated[cat.id] = new Date().toISOString();
      await saveHomeData();
      renderWho();
    });
    awayBtn.addEventListener('click', async ()=>{
      const cur = homeData.cats[cat.id];
      homeData.cats[cat.id] = (cur === false) ? null : false;
      homeData.lastUpdated[cat.id] = new Date().toISOString();
      await saveHomeData();
      renderWho();
    });

    choices.appendChild(homeBtn);
    choices.appendChild(awayBtn);
    card.appendChild(choices);
    whoGrid.appendChild(card);
  });
}

function renderNoteUpdated(){
  noteUpdatedText.textContent = formatUpdatedTime(homeData.noteUpdated);
}

noteInput.addEventListener('input', ()=>{
  homeData.note = noteInput.value;
  homeData.noteUpdated = new Date().toISOString();
  renderNoteUpdated();
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(async ()=>{ await saveHomeData(); }, 500);
});

async function checkForRollovers(){
  if(mealsData.date !== todayStr()){
    mealsData = defaultMealsData();
    await saveMealsData();
    renderCats();
  }
  if(applyHomeRollovers()){
    await saveHomeData();
    renderWho();
    noteInput.value = homeData.note;
    renderNoteUpdated();
  }
}

async function init(){
  await Promise.all([loadMealsData(), loadHomeData()]);
  renderCats();
  renderWho();
  noteInput.value = homeData.note || '';
  renderNoteUpdated();
  setInterval(checkForRollovers, 15000);
}
init();
</script>
</body>
</html>
